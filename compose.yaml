services:
  gameap-bot:
    # La imagen la construye y publica el workflow "docker" en
    # ghcr.io/neyzerth/gameap-discord (main -> :latest). Actualizar = pull + up.
    # Para construir en local (probar un cambio sin esperar al CI) descomenta el
    # bloque build y usa: docker compose up -d --build
    image: ghcr.io/neyzerth/gameap-discord:latest
    # build:
    #   context: .
    #   network: host          # BuildKit DNS is broken on this host; host network fixes npm ci
    container_name: gameap-bot
    user: "1000:1000"           # same uid as the host user, so ./data stays editable
    restart: unless-stopped
    network_mode: host          # UFW blocks container -> host; with host net it reaches 127.0.0.1:8025
    env_file: .env
    environment:
      GAMEAP_API_URL: http://127.0.0.1:8025
      STATE_FILE: /app/data/state.json
      FEEDS_STATE_FILE: /app/data/feeds.json
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
