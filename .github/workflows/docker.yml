name: docker

# Construye la imagen y la publica en el GitHub Container Registry (ghcr.io).
#
#   push a main      -> ghcr.io/<owner>/<repo>:latest y :sha-<corto>
#   tag v1.2.3       -> :1.2.3, :1.2, :latest y :sha-<corto>
#   pull request      -> solo compila (valida el Dockerfile), no publica
#   manual            -> botón "Run workflow"
#
# El paquete se crea la primera vez; su visibilidad se ajusta en GitHub, en el
# paquete (Packages) del repo. La imagen NO lleva secretos: .dockerignore deja
# fuera .env y la config real.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Los tests primero: no se publica una imagen que no pasa la suite ni el
  # chequeo de documentación (bilingüe). 106 tests, sin dependencias de red.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check:docs

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # El host es x86_64; añade linux/arm64 aquí si algún día lo necesitas.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
